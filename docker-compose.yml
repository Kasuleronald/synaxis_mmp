services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: life_mmp
      POSTGRES_PASSWORD: life_mmp_dev
      POSTGRES_DB: life_mmp
    ports:
      - "5432:5432"
    volumes:
      - life_mmp_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U life_mmp"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  life_mmp_db_data:
